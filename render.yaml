services:
  - type: web
    name: ff-battle-arena
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    branch: arena/01a10abe-ff-battlearena
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    disk:
      name: ff-battle-arena-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
